name: Dependency graph

# Submits the full Maven dependency tree (including transitive libraries) to GitHub,
# so Dependabot alerts cover more than the libraries listed directly in pom.xml.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - uses: advanced-security/maven-dependency-submission-action@v6
